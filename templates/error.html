{% extends "base.html" %}

{% block title %}{{ heading }} | CyberShield SMB{% endblock %}

{% block content %}
<section class="section-space error-section">
    <div class="container">
        <div class="error-panel mx-auto text-center">
            <div class="error-icon"><i class="bi {{ icon }}"></i></div>
            <span class="error-code">Error {{ code }}</span>
            <h1>{{ heading }}</h1>
            <p>{{ message }}</p>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                <a class="btn btn-primary" href="{{ url_for('home') }}"><i class="bi bi-house me-1"></i> Back to home</a>
                <a class="btn btn-outline-primary" href="{{ url_for('assessment') }}">Start an assessment</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
